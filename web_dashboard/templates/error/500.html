<!DOCTYPE html>
<html lang="en">
<head>
  <title>500 | BobCat</title>
  {% include 'include/dash-links.html' %}
</head>
<body>
  <div class="auth-layout auth-centered">

    <!-- Content Side -->
    <div class="auth-content">
      <a href="{{ url_for('web.index') }}" class="auth-logo"></a>

      <div class="auth-content-inner">
        <div class="error-page error-500">
          <div class="error-code">500</div>
          <h1 class="error-title">Something went wrong</h1>
          <p class="error-text">
            We're experiencing some technical difficulties. Our team has been notified
            and we're working to fix the issue. Please try again later.
          </p>
          <!-- <div class="error-ref">error ref: #ERR-2024-8412</div> -->
          <div class="error-actions">
            <a href="{{ url_for('dashboard.dashboard_home', guild_id=guild_id) if guild_id else url_for('web.index') }}" class="error-btn">
              <i class="bi bi-house"></i> Back to Dashboard
            </a>
            <button class="error-btn ghost" disabled>
              <i class="bi bi-bug"></i> Report Issue
            </button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="auth-footer">
        <div class="footer-copyright">
          © 2026 BobCat & <a href="https://bootstrapmade.com/trendy-admin-bootstrap-dashboard-template/">BootstrapMade TrendyAdmin</a>. All Rights Reserved.
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
