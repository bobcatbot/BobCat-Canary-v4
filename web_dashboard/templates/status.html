<!DOCTYPE html>
<html lang="en">
<head>
  <title>Status | BobCat Bot</title>
  {% include 'include/links.html' %}
</head>
<body>
  <!-- ======= Header ======= -->
  {% include 'components/Navbar.html' %}

  <!-- ======= Hero Section ======= -->
  <section class="page-header d-flex align-items-center">
    <div class="container d-flex flex-column align-items-center justify-content-center" data-aos="fade-up">      
      <h1>Bot status</h1>
      <p class="m-0">This page refreshes every 30 seconds. Last updated: <span id="updated">loading…</span></p>
    </div>
  </section><!-- End Hero -->

  <main>
    <div class="container mt-4">
      <button class="collapse-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
        What do the letters mean? (click to expand)
      </button>
      <div class="collapse" id="collapseExample">
        <div class="collapse-card collapse-card-body">
          {% for state in shard_states %}
          <p><b style="color: {{ state.color }};">{{ state.emoji or 'No letter' }}</b> - <b>{{ state.label }}.</b> {{ state.detail }}</p>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="alert" role="alert"></div>
    </div>

    <!-- ======= Shard list ======= -->
    <div id="shard-list" class="container my-4 mt-3 d-flex flex-wrap align-items-stretch gap-3"></div>
  </main>

  <div id="preloader"></div>
  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <script>
  const REFRESH_SECONDS = 30;
  let lastUpdate = null;   // last successful refresh, shown to the visitor
  let lastAttempt = 0;     // last try, so a failing API is retried every 30s, not every second

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function infoRow(label, value) {
    const row = el('div', 'text');
    row.append(el('b', 'title', label), value);
    return row;
  }

  function buildShardCard(shard) {
    const wrap = el('div', 'position-relative shard-card');
    wrap.dataset.id = shard.id;

    const card = el('div', 'card');
    card.style.cssText = 'text-align: center; background-color: #223;';
    card.dataset.color = shard.color;
    card.setAttribute('aria-describedby', `shard-${shard.id}`);

    const body = el('div', 'card-body');
    const title = el('h5', 'card-title m-0', shard.id);
    title.style.color = shard.color;
    body.append(title);
    if (shard.emoji) {
      const emoji = el('p', 'card-text', shard.emoji);
      emoji.style.color = shard.color;
      body.append(emoji);
    }
    card.append(body);

    // Guild names are user-controlled, so everything here goes in as text, never HTML
    const tooltip = el('div');
    tooltip.id = `shard-${shard.id}`;
    tooltip.setAttribute('role', 'tooltip');
    tooltip.append(
      infoRow('Status:', shard.label),
      infoRow('Latency:', shard.latency_ms === null ? '—' : `${shard.latency_ms}ms`),
      infoRow('Connected for:', shard.connected_since ? formatDuration(shard.connected_since) : '—'),
      infoRow('Servers:', shard.servers === null ? '—' : shard.servers),
    );
    if (shard.user_in_guilds.length) {
      const known = el('div', 'text flex-column');
      known.append(el('b', 'title', 'Servers you may know:'));
      shard.user_in_guilds.forEach(name => known.append(el('span', null, name)));
      tooltip.append(known);
    }

    wrap.append(card, tooltip);
    return wrap;
  }

  async function updateShardData() {
    lastAttempt = Date.now();
    try {
      const response = await fetch('/api/shard_status');
      const data = await response.json();

      const alertEl = document.querySelector('.alert[role="alert"]');
      const down = data.shards_total - data.shards_healthy;
      alertEl.classList.remove('alert-success', 'alert-danger');
      alertEl.textContent = down > 0
        ? `${down} of ${data.shards_total} shard(s) aren't fully online. Servers on them may not respond right now.`
        : `All systems are operational! ${data.shards_total} shard(s), ${data.guilds} servers`;
      alertEl.classList.add(down > 0 ? 'alert-danger' : 'alert-success');

      document.getElementById('shard-list').replaceChildren(...data.shards.map(buildShardCard));
      lastUpdate = Date.now();
    } catch (error) {
      console.error('Failed to update shard data:', error);
    }
  }

  function formatDuration(isoString) {
    const diff = Math.max(0, Math.floor((Date.now() - new Date(isoString)) / 1000));

    const d = Math.floor(diff / 86400);
    const h = Math.floor((diff % 86400) / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;

    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m`;
    return `${s}s`;
  }

  setInterval(() => {
    if (lastUpdate !== null) {
      const ago = Math.floor((Date.now() - lastUpdate) / 1000);
      document.getElementById('updated').textContent = ago < 2 ? 'just now' : `${ago}s ago`;
    }
    if (Date.now() - lastAttempt >= REFRESH_SECONDS * 1000) updateShardData();
  }, 1000);

  updateShardData();

  </script>
</body>
</html>

<style>
  .page-header {
    padding: 120px 0px 70px 0px;
    position: relative;
    width: 100%;
    height: 100%;
    color: #ffffff;
    background: #36393F;
    border-bottom: 2px solid #36393F;
    text-align: center;
  }

  [role="tooltip"],
  .hidetooltip + [role="tooltip"] {
    visibility: hidden;
    position: absolute;
    top: 108%;
    left: 40%;
    z-index: 1;
    width: max-content;
    padding: 6px;
    background: black;
    color: white;
    border-radius: 8px;
    transform: translate(-50%, 0);
  }
  [aria-describedby]:hover,
  [aria-describedby]:focus {
    position: relative;
  }
  [aria-describedby]:hover + [role="tooltip"],
  [aria-describedby]:focus + [role="tooltip"] {
    visibility: visible;
  }

  [role="tooltip"]::before,
  .hidetooltip + [role="tooltip"]::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    z-index: 1;
    width: 0;
    height: 0;
    transform: translate(0, -50%);
    /* make a triangle */
    border-width: 5px;
    border-style: solid;
    border-color: black transparent transparent transparent;
    rotate: 180deg;
  }
  @media (max-width: 480px) {
    [role="tooltip"] {
      left: 130%;
      right: 130%;
    }
    [role="tooltip"]::before {
      left: 22px;
      right: 22px;
    }
  }

  .text {
    display: flex;
    column-gap: 4px;
    color: #e4e7ea;
    font-size: 13px;
  }

  .title {
    font-weight: normal;
    color: #ffffff;
  }


  .collapse-button {
    padding: 0;
    background-color: transparent;
    color: white;
    border: none;
    cursor: pointer;
    transition-duration: 0.4s;
  }

  .collapse-card {
    background: transparent;
    margin-top: 4px;
    border: none;
  }
  .collapse-card.collapse-card-body p {
    margin: 0;
  }
</style>
