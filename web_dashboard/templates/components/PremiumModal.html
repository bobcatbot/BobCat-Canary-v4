<div id="PremiumModal" class="modal dark" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body position-relative">
        <button type="button" class="btn-close pm-close" data-bs-dismiss="modal" aria-label="Close"></button>

        <div class="pm-layout">
          <div class="pm-img d-none d-md-block"></div>

          <div class="pm-content">
            <h5 class="pm-title">
              You discovered a <span class="pm-accent">Premium</span> feature!
              Upgrade to unlock it.
            </h5>

            <ul class="pm-list">
              <li><i class="bi bi-check-circle-fill"></i> Access to everything</li>
              <li><i class="bi bi-check-circle-fill"></i> Early access</li>
              <li><i class="bi bi-check-circle-fill"></i> Fully refundable for 7 days</li>
              <li><i class="bi bi-check-circle-fill"></i> Cancel anytime</li>
            </ul>

            <div class="pm-buttons">
              <a href="/dashboard/{{guild.id}}/premium" class="btn btn-premium">Upgrade</a>
              <button class="btn" style="--bs-btn-color: #fff" data-bs-dismiss="modal">Not now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <style>
    /* Class names are pm-* on purpose: this component is included on many pages,
       and generic names (.icon, .content, .main-content) collide with theirs. */
    /* ta-main.css sizes dialogs with its own max-width (not --bs-modal-width) */
    #PremiumModal .modal-dialog {
      max-width: 760px;
    }

    #PremiumModal .pm-close {
      position: absolute;
      top: var(--bs-modal-padding);
      right: var(--bs-modal-padding);
      z-index: 2;
      opacity: 0.8;
    }
    #PremiumModal .pm-close:hover { opacity: 1; }

    #PremiumModal .pm-layout {
      display: flex;
      align-items: stretch;
      gap: 24px;
    }

    #PremiumModal .pm-img {
      flex: 0 0 43%;
      min-height: 300px;
      background: url('/static/img/bobcat-blob-plain.png') center / cover no-repeat;
    }

    #PremiumModal .pm-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 28px; /* keeps text clear of the close button */
    }

    #PremiumModal .pm-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.35;
    }
    #PremiumModal .pm-accent { color: var(--accent-color, #5865f2); }

    #PremiumModal .pm-list {
      list-style: none;
      padding: 0;
      margin: 1.1rem 0 1.4rem;
    }
    #PremiumModal .pm-list li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.3rem 0;
      font-size: 0.9rem;
    }
    #PremiumModal .pm-list i {
      flex-shrink: 0;
      font-size: 1.05rem;
      color: var(--accent-color, #5865f2);
    }

    #PremiumModal .pm-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</div>
